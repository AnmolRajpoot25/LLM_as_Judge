version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: llm_judge_postgres
    environment:
      POSTGRES_DB: llm_judge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llm_judge_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: llm_judge_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/llm_judge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-to-a-secure-random-secret-key-in-production}
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY:-change-this-to-a-secure-key-for-encrypting-user-api-keys}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: >
      sh -c "alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: .
    container_name: llm_judge_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/llm_judge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-to-a-secure-random-secret-key-in-production}
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY:-change-this-to-a-secure-key-for-encrypting-user-api-keys}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: celery -A src.workers.celery_app worker --loglevel=info

  flower:
    build: .
    container_name: llm_judge_flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A src.workers.celery_app flower --port=5555

volumes:
  pgdata:
  redisdata: